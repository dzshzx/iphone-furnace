[project]
name = "furnace-build-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "macholib==1.16.4",
    "numpy==2.2.6",
    "pillow==12.3.0",
]

[tool.uv]
# ADR 0048: project dependencies wait 3 days after release.
exclude-newer = "3 days"

[dependency-groups]
dev = ["pytest==9.1.1", "pyyaml==6.0.2"]


# ruff format 使用默认风格；版本固定在 scripts/format.sh。
[tool.ruff]
