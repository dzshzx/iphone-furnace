[project]
name = "furnace-build-tools"
version = "0.1.0"
# coremltools 定了 Python 线与版本：正式版 9.0 没有 cp314 轮子（上游 apple/coremltools#2646），预发布 9.1.dev1 有；
# 还没有任何版本有 cp315 轮子。正式版 9.1 发布后换回正式版，有 cp315 轮子后随登录环境升到 3.15。
requires-python = ">=3.14,<3.15"
dependencies = [
    "coremltools==9.1.dev1",
    "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==9.2.0"]


# ruff format 使用默认风格；版本固定在 scripts/gatelib.sh。
[tool.ruff.lint]
# EXE001、EXE002（shebang 与可执行位是否一致）ruff 在 WSL 上不执行，在别的 Linux 上才执行；
# 关掉后本机门禁与 GitHub 托管机上的结果相同。
ignore = ["EXE001", "EXE002"]

[tool.uv]
exclude-newer = "3 days"
