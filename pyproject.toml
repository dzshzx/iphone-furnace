[project]
name = "furnace-build-tools"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    # 预发布版：coremltools 正式版 9.0 没有 Python 3.14 轮子（上游 apple/coremltools#2646），
    # 9.1.dev1 有；正式版 9.1 发布后换回正式版。
    "coremltools==9.1.dev1",
    "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pyyaml==6.0.3"]


# ruff format 使用默认风格；版本固定在 scripts/format.sh。
[tool.ruff.lint]
# EXE001、EXE002（shebang 与可执行位是否一致）ruff 在 WSL 上不执行，在别的 Linux 上才执行；
# 关掉后本机门禁与 GitHub 托管机上的结果相同。
ignore = ["EXE001", "EXE002"]

[tool.uv]
exclude-newer = "3 days"
