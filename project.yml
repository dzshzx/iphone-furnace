name: Furnace
options:
  bundleIdPrefix: com.dzshzx
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "3"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Furnace:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Models
        excludes: [manifest.json]
        buildPhase: sources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzshzx.furnace
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/Furnace-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Furnace
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: CoreML.framework
      - sdk: IOSurface.framework
  FurnaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Furnace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Furnace:
    build:
      targets:
        Furnace: all
        FurnaceTests: [test]
    test:
      targets: [FurnaceTests]
      gatherCoverageData: true
