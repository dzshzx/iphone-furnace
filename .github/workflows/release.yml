name: Release
on:
  # 唯一的发版入口：gh workflow run release.yml --ref master -f bump=patch。
  # 版本号按最高的纯 vX.Y.Z tag 升一档算出；dry_run 可在任意分支跑完整验证，不打 tag、不发布。
  workflow_dispatch:
    inputs:
      bump:
        description: 升级档位（minor、major 须维护者先确认）
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 只验证并在摘要里打印将要发布的版本，不打 tag、不发布
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    # 显式写 bash 才带 -o pipefail：管道里 go run 失败时步骤随之失败，不被 tee 的退出码盖住。
    shell: bash
concurrency:
  # dry_run 在同一分支上新运行取消旧运行；正式发版排队执行，不被取消。
  group: release-${{ inputs.dry_run && format('dry-run-{0}', github.ref) || 'publish' }}
  cancel-in-progress: ${{ inputs.dry_run }}
jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      resume: ${{ steps.plan.outputs.resume }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # 在门禁之前核对分支与「已发过版」，尽早失败。头提交已有纯 vX.Y.Z tag 而同名 Release 未发布时沿用该版本续跑。
      - name: Compute release version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" >"$RUNNER_TEMP/tags.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name' \
            >"$RUNNER_TEMP/published.txt"
          go run ./cmd/furnace-tools release-version --bump "$BUMP" --head "$GITHUB_SHA" --dry-run="$DRY_RUN" \
            --ref "$GITHUB_REF" --default-branch "$DEFAULT_BRANCH" --published "$RUNNER_TEMP/published.txt" \
            <"$RUNNER_TEMP/tags.txt" | tee -a "$GITHUB_OUTPUT"
  checks:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  build:
    needs: [version, checks]
    runs-on: xcode-27
    # 托管 macOS 机变慢时，同样的命令会慢 3 到 13 倍，build 曾用约 26 分钟；放宽到 60 分钟，正常运行不被超时打断。
    timeout-minutes: 60
    # Only the publish step needs write access; checkout keeps the token out of git config.
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      GOTOOLCHAIN: local
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BUILD: ${{ needs.version.outputs.build }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 放在最前：末尾 if: always() 的验证报告要用 Go，后面的准备步骤失败也不影响它。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check private ANE model construction
        id: private-ane
        run: |
          mkdir -p build
          date +%s > build/preparation-start.txt
          started=$SECONDS
          trap 'printf "private-ane\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          bash scripts/check_private_ane.sh >build/private-ane-step.log 2>&1 || {
            cat build/private-ane-step.log
            exit 1
          }
          cat build/private-ane-step.log
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: true
      - name: Start fixed simulator
        run: |
          read -r simulator_id simulator_state < <(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next((d["udid"] + " " + d["state"]) for runtime,devices in json.load(sys.stdin)["devices"].items() if runtime.endswith("iOS-27-0") for d in devices if d["name"] == "iPhone 18 Pro Max"))')
          echo "FURNACE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          if [ "$simulator_state" != "Booted" ]; then xcrun simctl boot "$simulator_id"; fi
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
          xcodebuild -downloadComponent MetalToolchain
          curl -fL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate models and project
        id: models
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "models\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          uv sync --locked >build/models.log 2>&1
          uv run --locked python scripts/generate_models.py >>build/models.log 2>&1
          go run ./cmd/furnace-tools generate-icon >>build/models.log 2>&1
          uv run --locked pytest scripts/tests >>build/models.log 2>&1
          xcodegen generate >>build/models.log 2>&1
          tail -n 30 build/models.log
      - name: Inspect compiled Core ML plans
        id: compute-plan
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "compute-plan\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          xcrun swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library \
            Sources/Core/Types.swift Sources/Engines/NPUComputePlan.swift scripts/check_compute_plan.swift -o build/check-compute-plan \
            >build/compute-plan-build.log 2>&1 || {
              cat build/compute-plan-build.log
              exit 1
            }
          build/check-compute-plan Models/Stress{256,384,512}.mlpackage >build/compute-plan.log 2>&1 || {
            cat build/compute-plan.log
            exit 1
          }
          cat build/compute-plan.log
      # build.sh 把 RELEASE_VERSION 与 RELEASE_BUILD 作为 xcodebuild 参数传入，并核对 IPA 里的版本号与 build 号。
      - name: Build unsigned IPA
        id: device-build
        run: |
          mkdir -p build
          date +%s > build/preparation-end.txt
          started=$SECONDS
          trap 'printf "device-build\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          bash scripts/build.sh
      - name: Simulator lifecycle tests
        id: simulator-tests
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "simulator-tests\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          xcodebuild -project Furnace.xcodeproj -scheme Furnace -configuration Debug \
            -destination "platform=iOS Simulator,id=$FURNACE_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath build/simulator -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test >build/simulator-test.log 2>&1 || {
              tail -n 140 build/simulator-test.log
              exit 1
            }
      - name: Capture simulator UI
        run: |
          xcrun simctl bootstatus "$FURNACE_SIMULATOR_ID" -b
          xcrun simctl install "$FURNACE_SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/Furnace.app
          xcrun simctl launch "$FURNACE_SIMULATOR_ID" com.dzshzx.furnace
          sleep 2
          xcrun simctl io "$FURNACE_SIMULATOR_ID" screenshot dist/simulator-dashboard.png
      - name: Summarize macOS validation
        if: always()
        run: |
          mkdir -p build dist
          if [ -d build/tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/tests.xcresult >build/test-summary.json || rm -f build/test-summary.json
            xcrun xcresulttool get test-results tests --path build/tests.xcresult >build/test-cases.json || rm -f build/test-cases.json
          fi
          versions="$(xcodebuild -version | tr '\n' ' '); iOS SDK $(xcrun --sdk iphoneos --show-sdk-version); macOS $(sw_vers -productVersion); $(go version); $(python3 --version); $(uv --version 2>/dev/null || printf 'uv unavailable'); XcodeGen $(xcodegen --version 2>/dev/null || printf unavailable)"
          go run ./cmd/furnace-tools ci-report \
            --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --versions "$versions" \
            --private-ane '${{ steps.private-ane.outcome }}' \
            --models '${{ steps.models.outcome }}' \
            --compute-plan '${{ steps.compute-plan.outcome }}' \
            --device-build '${{ steps.device-build.outcome }}' \
            --simulator-tests '${{ steps.simulator-tests.outcome }}' \
            | tee dist/validation-report.md
          cat dist/validation-report.md >> "$GITHUB_STEP_SUMMARY"
      # 截图失败不影响发布已验证的安装包；任一构建或测试步骤失败都不打 tag。
      # 顺序：删同名旧草稿 → 建含全部资产的草稿 → 经 API 打附注 tag（续跑时 tag 已在本提交上，跳过）→ 转正。
      # 任何一步失败，修好后用同一条命令重跑即可。中文文本由 furnace-tools 生成，shell 里只留 ASCII。
      - name: Publish GitHub Release
        if: ${{ !cancelled() && steps.device-build.outcome == 'success' && steps.simulator-tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_RESUME: ${{ needs.version.outputs.resume }}
        run: |
          (cd dist && shasum -a 256 Furnace-unsigned.ipa >Furnace-unsigned.ipa.sha256)
          go run ./cmd/furnace-tools release-summary --tag "$RELEASE_TAG" --build "$RELEASE_BUILD" \
            --commit "$GITHUB_SHA" --dry-run="$DRY_RUN" --report dist/validation-report.md --notes dist/release-notes.md \
            dist/Furnace-unsigned.ipa dist/Furnace-unsigned.ipa.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          repo="$GITHUB_REPOSITORY"
          drafts="$(gh api "repos/$repo/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$RELEASE_TAG\") | .id")"
          for id in $drafts; do
            gh api -X DELETE "repos/$repo/releases/$id"
          done
          title="Furnace $RELEASE_VERSION (build $RELEASE_BUILD)"
          gh release create "$RELEASE_TAG" --repo "$repo" --draft --target "$GITHUB_SHA" --title "$title" \
            --notes-file dist/release-notes.md dist/Furnace-unsigned.ipa dist/Furnace-unsigned.ipa.sha256
          if [ "$RELEASE_RESUME" != "true" ]; then
            tag_object="$(gh api "repos/$repo/git/tags" -f tag="$RELEASE_TAG" -f message="$title" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
            gh api "repos/$repo/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null
          fi
          gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false --verify-tag
          echo "Published [$RELEASE_TAG](https://github.com/$repo/releases/tag/$RELEASE_TAG)." >>"$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build/*.log
            build/ci-timings.tsv
            build/preparation-start.txt
            build/preparation-end.txt
            build/test-summary.json
            build/test-cases.json
            build/tests.xcresult
            Models/manifest.json
            dist/Furnace.dSYM.zip
            dist/build-info.txt
            dist/validation-report.md
            dist/simulator-dashboard.png
          retention-days: 7
