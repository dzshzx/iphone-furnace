name: Build tools checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # 以下各步与 scripts/check.sh（合入前门禁）同源，改一处须同步另一处；
    # check.sh 另检查生成步骤未改动已跟踪文件。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check
      - name: Check build scripts
        run: bash -n scripts/build.sh scripts/check_private_ane.sh
      - name: Generate models and validate build tools
        run: |
          uv sync --locked
          uv run --locked python scripts/generate_models.py
          uv run --locked python scripts/generate_icon.py
          uv run --locked pytest scripts/tests
