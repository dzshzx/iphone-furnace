name: Build tools checks

on:
  # Every candidate and pull request runs the checks, documentation-only ones
  # included: the master ruleset requires ci-ok on the exact SHA.
  push:
    branches: [master, 'candidate/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check
      - name: Check build scripts
        run: bash -n scripts/build.sh scripts/check_private_ane.sh
      - name: Generate models and validate build tools
        run: |
          uv sync --locked
          uv run --locked python scripts/generate_models.py
          uv run --locked python scripts/generate_icon.py
          uv run --locked pytest scripts/tests

  # The master ruleset requires this one check on every pushed SHA. It runs even
  # when a needed job fails or is skipped, and succeeds only if every needed job
  # succeeded, so adding or renaming jobs never touches the ruleset.
  ci-ok:
    if: always()
    needs: [tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf '%s\n' "$NEEDS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a needed job concluded $result"; exit 1; }
          done
