name: iOS build
on:
  # Full Apple-platform validation is requested manually and includes Linux tools
  # checks first. A validated master build publishes its IPA as GitHub Release
  # v<MARKETING_VERSION> only while that tag does not exist yet.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 35
    # Only the release step needs write access; checkout keeps the token out of git config.
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check private ANE model construction
        id: private-ane
        run: |
          mkdir -p build
          date +%s > build/preparation-start.txt
          started=$SECONDS
          trap 'printf "private-ane\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          bash scripts/check_private_ane.sh >build/private-ane-step.log 2>&1 || {
            cat build/private-ane-step.log
            exit 1
          }
          cat build/private-ane-step.log
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Start fixed simulator
        run: |
          read -r simulator_id simulator_state < <(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next((d["udid"] + " " + d["state"]) for runtime,devices in json.load(sys.stdin)["devices"].items() if runtime.endswith("iOS-27-0") for d in devices if d["name"] == "iPhone 18 Pro Max"))')
          echo "FURNACE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          if [ "$simulator_state" != "Booted" ]; then xcrun simctl boot "$simulator_id"; fi
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
          xcodebuild -downloadComponent MetalToolchain
          curl -fL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate models and project
        id: models
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "models\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          uv sync --locked >build/models.log 2>&1
          uv run --locked python scripts/generate_models.py >>build/models.log 2>&1
          uv run --locked python scripts/generate_icon.py >>build/models.log 2>&1
          uv run --locked pytest scripts/tests >>build/models.log 2>&1
          xcodegen generate >>build/models.log 2>&1
          tail -n 30 build/models.log
      - name: Inspect compiled Core ML plans
        id: compute-plan
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "compute-plan\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          xcrun swiftc -swift-version 6 -strict-concurrency=complete -parse-as-library \
            Sources/Core/Types.swift Sources/Engines/NPUComputePlan.swift scripts/check_compute_plan.swift -o build/check-compute-plan \
            >build/compute-plan-build.log 2>&1 || {
              cat build/compute-plan-build.log
              exit 1
            }
          build/check-compute-plan Models/Stress{256,384,512}.mlpackage >build/compute-plan.log 2>&1 || {
            cat build/compute-plan.log
            exit 1
          }
          cat build/compute-plan.log
      - name: Build unsigned IPA
        id: device-build
        run: |
          mkdir -p build
          date +%s > build/preparation-end.txt
          started=$SECONDS
          trap 'printf "device-build\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          bash scripts/build.sh
      - name: Simulator lifecycle tests
        id: simulator-tests
        run: |
          mkdir -p build
          started=$SECONDS
          trap 'printf "simulator-tests\t%d\n" "$((SECONDS-started))" >> build/ci-timings.tsv' EXIT
          xcodebuild -project Furnace.xcodeproj -scheme Furnace -configuration Debug \
            -destination "platform=iOS Simulator,id=$FURNACE_SIMULATOR_ID" -parallel-testing-enabled NO \
            -derivedDataPath build/simulator -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test >build/simulator-test.log 2>&1 || {
              tail -n 140 build/simulator-test.log
              exit 1
            }
      - name: Capture simulator UI
        run: |
          xcrun simctl bootstatus "$FURNACE_SIMULATOR_ID" -b
          xcrun simctl install "$FURNACE_SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/Furnace.app
          xcrun simctl launch "$FURNACE_SIMULATOR_ID" com.dzshzx.furnace
          sleep 2
          xcrun simctl io "$FURNACE_SIMULATOR_ID" screenshot dist/simulator-dashboard.png
      - name: Summarize macOS validation
        if: always()
        run: |
          mkdir -p build dist
          if [ -d build/tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/tests.xcresult >build/test-summary.json || rm -f build/test-summary.json
            xcrun xcresulttool get test-results tests --path build/tests.xcresult >build/test-cases.json || rm -f build/test-cases.json
          fi
          versions="$(xcodebuild -version | tr '\n' ' '); iOS SDK $(xcrun --sdk iphoneos --show-sdk-version); macOS $(sw_vers -productVersion); $(python3 --version); $(uv --version 2>/dev/null || printf 'uv unavailable'); XcodeGen $(xcodegen --version 2>/dev/null || printf unavailable)"
          python3 scripts/ci_report.py \
            --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --versions "$versions" \
            --private-ane '${{ steps.private-ane.outcome }}' \
            --models '${{ steps.models.outcome }}' \
            --compute-plan '${{ steps.compute-plan.outcome }}' \
            --device-build '${{ steps.device-build.outcome }}' \
            --simulator-tests '${{ steps.simulator-tests.outcome }}' \
            | tee dist/validation-report.md
          cat dist/validation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        if: always() && steps.device-build.outcome == 'success' && steps.simulator-tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plist=build/device/Build/Products/Release-iphoneos/Furnace.app/Info.plist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          tag="v$version"
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Release skipped: $GITHUB_REF is not master; this run only validates." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ls-remote --exit-code: 0 = tag exists, 2 = absent, anything else = lookup failed.
          tag_lookup=0
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null || tag_lookup=$?
          if [ "$tag_lookup" -eq 0 ]; then
            echo "Release skipped: $tag already exists; bump MARKETING_VERSION in project.yml to publish a new IPA." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$tag_lookup" -ne 2 ]; then
            echo "::error::Could not check whether $tag exists (git ls-remote exit $tag_lookup)."
            exit 1
          fi
          (cd dist && shasum -a 256 Furnace-unsigned.ipa > Furnace-unsigned.ipa.sha256)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Furnace $version (build $build_number)" --notes-file dist/validation-report.md \
            dist/Furnace-unsigned.ipa dist/Furnace-unsigned.ipa.sha256
          echo "Published [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build/*.log
            build/ci-timings.tsv
            build/preparation-start.txt
            build/preparation-end.txt
            build/test-summary.json
            build/test-cases.json
            build/tests.xcresult
            Models/manifest.json
            dist/Furnace.dSYM.zip
            dist/build-info.txt
            dist/validation-report.md
            dist/simulator-dashboard.png
          retention-days: 7
